
services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile

    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3001"
      DB_PATH: /app/server/data/users.sqlite

    volumes:
      - sqlite_data:/app/server/data

    expose:
      - "3001"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3001/api/users?limit=1',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      server:
        condition: service_healthy

volumes:
  sqlite_data:
